name: Semgrep PR Security Scan

on:
  pull_request:
    branches:
      - master
      - pr*

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@b4ffbf834c0629c142f8ab13860a2e26f35941d3  # v4.1.1
        with:
          fetch-depth: 0

      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@6c4a8b7eb95aaf4b56e0ac4b431d34e6c5758332  # v1.25.0
        with:
          generateSarif: "true"
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
            p/python
            p/javascript
            p/java

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@c0d1dde3cf51db930c5702cb2b7e920faf63495c  # v3.1.0
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('semgrep.sarif')) {
              const sarif = JSON.parse(fs.readFileSync('semgrep.sarif', 'utf8'));
              const issues = sarif.runs[0].results || [];
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔒 Semgrep Scan\n\n**Issues Found:** ${issues.length}\n\nPer Snyk Security At Inception:\n1. Review findings\n2. Fix security issues\n3. Rescan to verify\n4. Repeat until no new issues`
              });
            }
        continue-on-error: true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@0b2256b2c4d4311b4fb8e6a897756a1a3467b58f  # v4.0.0
        with:
          name: semgrep-reports
          path: semgrep.sarif