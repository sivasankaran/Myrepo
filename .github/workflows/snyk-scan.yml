name: Snyk Security Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  security-events: write
  statuses: write

jobs:
  snyk-scan:
    name: snyk-scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee6c7ff8ce3092ce073d6b586f025db46784498f  # v4

      - uses: actions/setup-node@60edb5dd545a775178fac7f3f4f7f78a9b6cad7f  # v4
        with:
          node-version: '20'

      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate with Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Snyk Code scan on triag.py
        run: snyk code test triag.py --sarif-file-output=reports/snyk-triag.sarif
        continue-on-error: true

      - name: Run Snyk Code scan on example.c
        run: snyk code test example.c --sarif-file-output=reports/snyk-example.sarif
        continue-on-error: true

      - name: Run Snyk Code scan on snake.py
        run: snyk code test snake.py --sarif-file-output=reports/snyk-snake.sarif
        continue-on-error: true

      - name: Run Snyk dependency scan
        run: snyk test --sarif-file-output=reports/snyk-dependencies.sarif
        continue-on-error: true

      - name: Upload SARIF reports
        uses: github/codeql-action/upload-sarif@c0d1dde3cf51db930c5702cb2b7e920faf63495c  # v3
        if: always()
        with:
          sarif_file: reports/snyk-*.sarif
          category: snyk-security

      - name: Check for critical issues
        run: |
          echo "✅ Snyk scan completed. Review results in Security tab."
        continue-on-error: true