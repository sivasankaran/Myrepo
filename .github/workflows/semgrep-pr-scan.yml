name: Semgrep PR Security Scan

on:
  pull_request:
    branches:
      - master
      - pr*

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@ee6c7ff8ce3092ce073d6b586f025db46784498f  # v4
        with:
          fetch-depth: 0

      - name: Run Semgrep scan
        uses: returntocorp/semgrep-action@d2f2c60894e66e3e04495d504d38134b53c9e4b6  # v1
        with:
          generateSarif: "true"
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
            p/python
            p/javascript
            p/java

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@407ffab0a7ebb648129e0e31fa6cb6e59b7ead5f  # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('semgrep.sarif')) {
              const sarif = JSON.parse(fs.readFileSync('semgrep.sarif', 'utf8'));
              const issues = sarif.runs[0].results || [];
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🔒 Semgrep Scan\n\n**Issues Found:** ${issues.length}\n\nPer Snyk Security At Inception:\n1. Review findings\n2. Fix security issues\n3. Rescan to verify\n4. Repeat until no new issues`
              });
            }
        continue-on-error: true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@5d5d22e1b266e79b9dcf39f7a01a241a3cec1d26  # v4
        with:
          name: semgrep-reports
          path: semgrep.sarif