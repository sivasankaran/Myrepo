name: Snyk Code

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  snyk-code:
    name: Snyk Code Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (for Snyk CLI prerequisites)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Prepare report directory
        run: mkdir -p .cx/reports

      - name: Authenticate Snyk (non-interactive)
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Code scan
        run: snyk code test --sarif-file-output=.cx/reports/snyk-code.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .cx/reports/snyk-code.sarif
        continue-on-error: true

      - name: Upload SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-code-sarif
          path: .cx/reports/snyk-code.sarif