name: Semgrep PR Security Scan

on:
  pull_request:
    branches:
      - master
      - pr*

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: semgrep --config=p/security-audit --json --output=semgrep-results.json . || true

      - name: Convert to SARIF
        run: |
          python3 << 'EOF'
          import json
          with open('semgrep-results.json') as f:
            results = json.load(f)
          sarif = {
            "version": "2.1.0",
            "runs": [{
              "tool": {"driver": {"name": "Semgrep"}},
              "results": results.get("results", [])
            }]
          }
          with open('semgrep.sarif', 'w') as f:
            json.dump(sarif, f)
          EOF

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('semgrep-results.json'));
            const count = results.results ? results.results.length : 0;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Semgrep Security Scan\n\n**Issues Found:** ${count}\n\n**Per Snyk Security At Inception:**\n1. Review all findings\n2. Fix security issues in your code\n3. Rescan after fixes\n4. Repeat until no new issues`
            });