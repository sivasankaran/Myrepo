name: Snyk Security Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  security-events: write
  statuses: write

jobs:
  snyk-scan:
    name: snyk-scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk
        run: npm install -g snyk

      - name: Authenticate with Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Snyk Code scan on Python files
        run: snyk code test triag.py --sarif-file-output=reports/snyk-triag.sarif
        continue-on-error: true

      - name: Run Snyk Code scan on C files
        run: snyk code test example.c --sarif-file-output=reports/snyk-example.sarif
        continue-on-error: true

      - name: Run Snyk Code scan on Python Snake game
        run: snyk code test snake.py --sarif-file-output=reports/snyk-snake.sarif
        continue-on-error: true

      - name: Run Snyk dependency scan
        run: snyk test --sarif-file-output=reports/snyk-dependencies.sarif
        continue-on-error: true

      - name: Upload SARIF reports
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/snyk-*.sarif
          category: snyk-security

      - name: Fail if critical issues found
        run: |
          if grep -q "\"level\": \"error\"" reports/snyk-*.sarif; then
            echo "❌ Critical security issues found. Please fix them before merging."
            exit 1
          else
            echo "✅ No critical security issues found."
          fi
        continue-on-error: false