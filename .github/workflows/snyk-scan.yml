name: Snyk Security Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  snyk-scan:
    name: Snyk Code & SCA Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffbf834c0629c142f8ab13860a2e26f35941d3  # v4.1.1

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.0.0
        with:
          node-version: '20'

      - name: Install Snyk CLI
        uses: snyk/actions/setup@b98d3c99e0e58309f2708ec077e46e6bed0c60d1  # v1.1.0

      - name: Authenticate Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Create reports directory
        run: mkdir -p .snyk/reports

      - name: Run Snyk Code scan
        run: snyk code test --sarif-file-output=.snyk/reports/snyk-code.sarif
        continue-on-error: true

      - name: Run Snyk SCA scan
        run: snyk test --sarif-file-output=.snyk/reports/snyk-sca.sarif
        continue-on-error: true

      - name: Upload Code Scanning SARIF
        uses: github/codeql-action/upload-sarif@c0d1dde3cf51db930c5702cb2b7e920faf63495c  # v3.1.0
        with:
          sarif_file: .snyk/reports/snyk-code.sarif
          category: snyk-code
        continue-on-error: true

      - name: Upload SCA SARIF
        uses: github/codeql-action/upload-sarif@c0d1dde3cf51db930c5702cb2b7e920faf63495c  # v3.1.0
        with:
          sarif_file: .snyk/reports/snyk-sca.sarif
          category: snyk-sca
        continue-on-error: true

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@0b2256b2c4d4311b4fb8e6a897756a1a3467b58f  # v4.0.0
        with:
          name: snyk-reports
          path: .snyk/reports/